apiVersion: apps/v1
kind: Deployment
metadata:
  name: museum-app
  namespace: hl08
  labels:
    app: museum-app
spec:
  replicas: 1
  minReadySeconds: 30  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  
      maxSurge: 1        
  selector:
    matchLabels:
      app: museum-app
  template:
    metadata:
      labels:
        app: museum-app
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      hostAliases:
        - ip: "10.60.3.12"
          hostnames:
            - "hl14.zil"
        - ip: "10.60.3.13"
          hostnames:
            - "hl15.zil"
      containers:
        - name: museum-app
          image: yanau/hl:1.0.1
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secret
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
