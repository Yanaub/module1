apiVersion: apps/v1
kind: Deployment
metadata:
  name: museum-additional
  namespace: hl08
spec:
  replicas: 1
  minReadySeconds: 30  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  
      maxSurge: 1
  selector:
    matchLabels:
      app: museum-additional
  template:
    metadata:
      labels:
        app: museum-additional
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      hostAliases:  
        - ip: "10.60.3.12"
          hostnames:
            - "hl14.zil"
        - ip: "10.60.3.13"
          hostnames:
            - "hl15.zil"
      containers:
        - name: museum-additional
          image: yanau/museum-additional:1.0.10
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          envFrom:
            - configMapRef:
                name: add-config
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12  
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
