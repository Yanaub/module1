spring.application.name=module1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL}
spring.flyway.enabled=true

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

server.tomcat.max-threads=${TOMCAT_MAX_THREADS}
server.tomcat.min-spare-threads=${TOMCAT_MIN_SPARE_THREADS}
server.tomcat.mbeanregistry.enabled=true


observability.window.short=10
observability.window.medium=30
observability.window.long=60
observability.schedule.ms=10000

spring.kafka.bootstrap-servers=hl15.zil:9094
spring.kafka.consumer.group-id=hl08-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=digital.zil.hl.module1.kafka.dto
spring.kafka.consumer.properties.spring.json.use.type.headers=false

app.kafka.topic=hl08
app.kafka.partitions=2
app.kafka.concurrency=${APP_KAFKA_CONCURRENCY}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState